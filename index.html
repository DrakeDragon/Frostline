<body>
<canvas id="c"></canvas>
<div id="padL"></div>

<div id="hint">HOLD = PUMP &amp; CHARGE<br>RELEASE IN THE GLOWING BAND = POP<br>PERFECT POPS BUILD MOMENTUM<br>IN AIR: DRAG = SPIN / FLIP</div>
<button id="uber">UBER</button>
<div id="btns">
  <button class="gb" data-g="0">INDY</button>
  <button class="gb" data-g="1">MUTE</button>
  <button class="gb" data-g="2">NOSE</button>
  <button class="gb" data-g="3">TAIL</button>
</div>
<button id="pauseBtn">II</button>
<div id="toast"><b></b><span></span></div>

<script>
(function(){
'use strict';
/* ================= CORE ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const D2R=Math.PI/180;
const wrap180=a=>((a+180)%360+360)%360-180;
const sgn=v=>v>0?1:v<0?-1:0;
const COL={cy:'#19e6ff',mg:'#ff2fb9',gold:'#ffd23f'};

/* ---------- physics constants ---------- */
const G=24, GA_BASE=17, V_CAP=31, PUMP=15;
const PIPE={flat:4,R:9,alpha:80*D2R,lipX:0,lipY:0};
function setPipe(f,R){PIPE.flat=f;PIPE.R=R;PIPE.lipX=f+R*Math.sin(PIPE.alpha);PIPE.lipY=R*(1-Math.cos(PIPE.alpha));}
setPipe(4,9);
let GEO=null;
let AIRMOD={spin:1,flip:1,grab:1,hb:1};
function groundY(x){
  if(GEO) return GEO.y(x);
  const a=Math.abs(x);
  if(a<=PIPE.flat) return 0;
  if(a>=PIPE.lipX) return PIPE.lipY;
  const d=a-PIPE.flat;
  return PIPE.R-Math.sqrt(PIPE.R*PIPE.R-d*d);
}
function groundSlope(x){
  if(GEO) return GEO.slope(x);
  const a=Math.abs(x);
  if(a<=PIPE.flat||a>=PIPE.lipX) return 0;
  const d=a-PIPE.flat;
  const s=d/Math.sqrt(PIPE.R*PIPE.R-d*d);
  return x<0?-s:s;
}
function distToLip(x){if(GEO) return GEO.dist(x);const d=clamp((Math.abs(x)-PIPE.flat)/PIPE.R,0,1);return PIPE.R*(PIPE.alpha-Math.asin(d));}

  E={spin:R.spin,flip:R.flip,air:R.air*B.pop,pump:R.pump*B.pump,bal:R.bal*B.bal,vcap:B.vcap+V.vcap};
}
function setVenue(i){curVenue=i;const V=VENUES[i];setPipe(V.flat,V.R);recalcE();if(typeof buildProfile==='function') buildProfile();}
function dailyConfig(){
  const seed=hashStr('frostline-'+dayNum()), rng=mulberry32(seed);
  const open=[];for(let i=0;i<VENUES.length;i++) if(venueUnlocked(i)) open.push(i);
  return {seed,venue:open[Math.floor(rng()*open.length)],mod:MODS[Math.floor(rng()*MODS.length)]};
}

/* ---------- goals ---------- */
function pickGoals(rng){
  const V=VENUES[curVenue], out=[], used={};
  for(let d=0;d<3;d++){
    const c=GOAL_T.filter(g=>!used[g.k]&&(g.tier==='medal'||g.tier[d]!=null));
    const g=c[Math.floor(rng()*c.length)];
    used[g.k]=1;
    const target=g.tier==='medal'?Math.round([V.medals[0]*0.8,V.medals[1],V.medals[2]*0.9][d]/1000)*1000:g.tier[d];
    out.push({k:g.k,target,desc:g.txt(target),d,xp:[60,120,250][d],coin:[30,60,120][d],done:false});
  }
  return out;
}
let briefGoals=[];
function goalVal(k){return k==='score'?S.score:(S.st[k]||0);}
function checkGoals(){
  if(S.mode!=='play'||S.tut) return;
  for(const g of S.goals){
    if(!g.done&&goalVal(g.k)>=g.target){
      g.done=true; S.xpBonus+=g.xp; S.coinBonus+=g.coin;
      toast('GOAL COMPLETE','+'+g.coin+' coins  +'+g.xp+' XP');
      sfx(880,.3,'triangle',.09,500); buzz([30,40,30]);
    }
  }
}

/* ---------- state ---------- */
function newStats(){return {rank:0,clean:0,boosts:0,topSpd:0,pads:0,landed:0,gems:0,gold:0,perfects:0,perfStreak:0,maxPerfStreak:0,maxAlt:0,maxSpin:0,maxFlips:0,maxComps:0,maxChain:0,banked:0,ubers:0,bails:0,maxMom:0,newTricks:0,tricksTotal:0,maxDist:0};}
function newS(mode){

  return {mode,time:V.time*MOD.time,prog:0,score:0,disp:0,meter:0,t:0,mom:0,hintT:0,achT:0,
    st:newStats(),bestPts:0,bestName:'-',tut:null,goals:[],xpBonus:0,coinBonus:0,len:V.len*(MOD.time<1?0.8:1)};

let S, r, combo={pool:0,chain:0,timer:0};
let parts=[],pops=[],gems=[],trail=[];
let shake=0,shx=0,shy=0,cheer=0,slowT=0,flash=0,recenter=false,uberReq=false,wasPump=false;
const input={pump:false,sx:0,sy:0,g:[false,false,false,false]};
const T={pump:false,sx:0,sy:0,g:[false,false,false,false]};

function freshRider(){

    flip:0,flip0:0,flipIn:0,spin:0,ang:0,fx:1,baseFace:1,face:1,grab:-1,grabT:[0,0,0,0],
    pop:0,popT:0,popG:-1,charge:0,drift:0.8,dirIn:1,aIn:4.7,vy0:10,thRef:0,bail:0,tumble:0,uber:null,uberDone:false,uberName:'',crouch:0};

function startRun(opts){
  opts=opts||{};

/* ---------- helpers ---------- */
function popup(text,col,size,x,y){
  pops.push({x:x==null?r.x:x,y:y==null?r.y+2.5:y,t:0,life:1.7,text,col:col||'#fff',size:size||22});
  if(pops.length>12) pops.shift();
}
function spray(x,y,vx,vy,n,col,sz){
  for(let i=0;i<n;i++) parts.push({x,y,vx:vx+(Math.random()-.5)*6,vy:vy+Math.random()*4,t:0,life:.45+Math.random()*.5,col,sz:sz*(.6+Math.random()*.8)});
  if(parts.length>500) parts.splice(0,parts.length-500);
}
function popZone(){if(GEO) return GEO.inZone();return !r.air&&r.bail<=0&&Math.abs(r.x)>PIPE.flat+PIPE.R*0.3&&r.v*sgn(r.x)>4;}
function remAir(){const ga=GA_BASE*MOD.ga;const gr=GEO?GEO.refY(r.x+r.vx*0.8):3;const disc=r.vy*r.vy+2*ga*Math.max(0,r.y-gr);return (r.vy+Math.sqrt(disc))/ga;}
function makeGems(){
  if(GEO){ if(typeof makeAirGems==='function') makeAirGems(); return; }
  gems=[];
  for(const sd of [-1,1]){
    const add=(t,n)=>{
      const T_=GEM_TIERS[t], cnt=Math.max(1,Math.round(n*MOD.gemn));
      for(let i=0;i<cnt;i++){
        const h=T_.lo+(T_.hi-T_.lo)*((i+rnd()*0.8)/cnt);
        gems.push({x:sd*(PIPE.lipX+0.3+rnd()*2.0),y:PIPE.lipY+h,t,val:T_.val*MOD.gemv,col:T_.col,got:false,ph:rnd()*6});
      }
    };
    add(0,2);add(1,2);add(2,2);add(3,1);
  }
}
function respawnGems(){
  if(GEO) return;
  for(const g of gems){ if(!g.got) continue;
    const T_=GEM_TIERS[g.t], sd=sgn(g.x), h=T_.lo+(T_.hi-T_.lo)*rnd();
    g.x=sd*(PIPE.lipX+0.3+rnd()*2.0); g.y=PIPE.lipY+h; g.got=false; g.a=0; }
}
function collectGem(g){
  g.got=true;
  spray(g.x,g.y,0,2,14,g.col,.22);
  sfx(700+g.t*170,.18,'triangle',.07,300); buzz(g.t>=2?[15,20,15]:10);
  if(g.t===3){cheer=1;flash=0.5;}
  if(S.mode!=='play') return;
  S.st.gems++; if(g.t===3) S.st.gold++;
  combo.pool+=g.val; combo.timer=Math.max(combo.timer,3.8);
  S.meter=Math.min(100,S.meter+g.val/40*MOD.meter);
  popup('+'+g.val+' GEM',g.col,18+g.t*2,g.x,g.y+1.2);
}

/* ---------- tricks ---------- */
function trickInfo(){
  const n=Math.round(Math.abs(r.spin)/180), fl=Math.round(Math.abs(r.flipIn)/360);
  const gs=[]; let gt=0;
  for(let i=0;i<4;i++) if(r.grabT[i]>0.22){gs.push(GRABS[i].name);gt+=r.grabT[i];}
  let pts=0;
  if(n>0) pts+=100*n*(1+0.25*(n-1))*AIRMOD.spin;
  if(fl>0) pts+=350*fl*(1+0.5*(fl-1))*AIRMOD.flip;
  if(gs.length) pts+=(150*gs.length+120*gt)*AIRMOD.grab;
  const comps=(n>0?1:0)+(fl>0?1:0)+gs.length;
  pts*=1+0.25*Math.max(0,comps-1);
  const hb=Math.max(0,r.peak-PIPE.lipY);
  pts+=25*hb*AIRMOD.hb;
  const p=[];
  if(gs.length) p.push(gs.join('+'));
  if(n>0) p.push(String(n*180));
  if(fl>0) p.push((fl>1?(fl===2?'Double ':'Triple '):'')+(r.flipIn>0?'Backflip':'Frontflip'));
  let name=p.join(' ');
  if(!name) name=hb>3?'Big Air':'Straight Air';
  let sig=null;
  if(comps>0) for(const s of SIGS) if(s.t(n,fl,gs)){sig=s;break;}
  if(sig){pts*=1.4;name=sig.name;}
  return {pts:Math.round(pts),name,comps,n,fl,hb,gs,sig,key:(gs.slice().sort().join('+')||'-')+'|'+n+'|'+fl};
}
function bank(){
  if(combo.pool<=0){combo.chain=0;return;}
  const mult=1+MOD.chain*Math.min(10,Math.max(0,combo.chain-1));
  const tot=Math.round(combo.pool*mult);
  if(S.mode==='play'){
    S.score+=tot; S.st.maxChain=Math.max(S.st.maxChain,combo.chain); S.st.banked=Math.max(S.st.banked,tot);
    popup('COMBO BANKED +'+tot.toLocaleString(),COL.cy,24,r.x*0.6,r.y+4);
    sfx(660,.25,'triangle',.08,500); cheer=Math.max(cheer,0.6);
  }
  combo.pool=0; combo.chain=0; combo.timer=0;
}
function comboMult(){return 1+MOD.chain*Math.min(10,Math.max(0,combo.chain-1));}

function doBail(reason,vt){
  r.bail=1.3; r.tumble=0; r.v=vt*0.45; r.uber=null;
  if(S.mode==='play'){
    S.st.bails++; S.meter*=0.6; S.mom*=0.4; S.st.perfStreak=0;
    if(combo.pool>0) popup('COMBO LOST',COL.mg,22,r.x*0.7,r.y+5);
    combo.pool=0; combo.chain=0; combo.timer=0;
    popup(reason,COL.mg,26);
  }
  shake=Math.max(shake,10); buzz([60,30,80]);
  spray(r.x,r.y,0,6,28,'rgba(255,255,255,.9)',.22);
  sfx(160,.35,'sawtooth',.09,-90);
}

/* ---------- movement ---------- */
function takeoff(){
  const th=Math.atan(groundSlope(sgn(r.x)*(PIPE.lipX-0.001))), c=Math.cos(th), s=Math.sin(th);
  r.vx=r.v*c; r.vy=r.v*s;
  r.x=sgn(r.x)*PIPE.lipX; r.y=PIPE.lipY;
  r.air=true; r.airT=0; r.peak=r.y;
  r.thRef=th/D2R; r.flip=r.ang; r.flip0=r.flip; r.flipIn=0; r.spin=0;
  r.grabT=[0,0,0,0]; r.grab=-1;
  r.dirIn=-sgn(r.x); r.aIn=1.12*GA_BASE*MOD.ga*Math.abs(r.vx)/Math.max(r.vy,4); r.charge=0;
  r.vy0=Math.max(r.vy,5);
  r.baseFace=sgn(r.fx)||1; r.face=r.baseFace;
  r.drift=r.pop?[0.6,0.4,0.28,0.2][r.pop-1]:0.8;
  r.uber=null; r.uberDone=false;
  recenter=true;
  if(S.mode==='play'){
    if(!r.pop){S.mom=Math.max(0,S.mom-0.5); S.st.perfStreak=0; if(!S.tut||S.tut.step>1) popup('NO POP',COL.mg,18,r.x*0.8,r.y+3);}
    else if(r.pop>=3) popup('LOW DRIFT',COL.cy,16,r.x*0.8,r.y+3);
  }
  sfx(300,.15,'triangle',.05,300);
}

function land(){
  const th=Math.atan(groundSlope(r.x)), c=Math.cos(th), s=Math.sin(th);
  const vt=r.vx*c+r.vy*s;
  const thD=th/D2R;
  const fErr=Math.abs(wrap180(r.flip-thD));
  const sp=((r.spin%180)+180)%180, sErr=Math.min(sp,180-sp);
  const tricky=r.airT>0.3;
  r.y=groundY(r.x); r.air=false; r.v=vt; r.pop=0; r.popT=0; r.charge=0; recenter=true; if(!GEO) respawnGems();
  r.ang=thD+wrap180(r.flip-thD);
  const cut=!!r.uber;
  if(tricky&&(cut||fErr>60*E.bal||sErr>45*E.bal)){
    doBail(cut?'CUT SHORT!':(fErr>60*E.bal?'WIPEOUT!':'SKETCHY LANDING'),vt);
    return;
  }
  const ti=trickInfo();
  let pts=ti.pts, name=ti.name;
  if(r.uberDone){pts+=2500; name=r.uberName;}
  if(r.airT<0.45&&!r.uberDone){ pts=0; }
  const perfect=tricky&&fErr<22*Math.max(1,E.bal*0.9)&&sErr<24*Math.max(1,E.bal*0.9);
  if(pts>0&&perfect) pts=Math.round(pts*1.25);
  if(!tricky&&fErr>40) r.v*=0.8;
  spray(r.x,r.y,vt*0.1,4,perfect?24:12,'rgba(255,255,255,.9)',.2);
  shake=Math.max(shake,tricky?4:1);
  if(S.mode==='play'){
    if(perfect) S.mom=Math.min(6,S.mom+0.2); else if(tricky&&(fErr>38||sErr>32)) S.mom=Math.max(0,S.mom-0.4);
    S.st.maxMom=Math.max(S.st.maxMom,S.mom);
  }
  if(S.mode==='play'&&pts>=50){
    combo.chain++; combo.pool+=pts; combo.timer=3.8;
    const st=S.st; st.landed++; st.tricksTotal++;
    st.maxChain=Math.max(st.maxChain,combo.chain);
    st.maxSpin=Math.max(st.maxSpin,ti.n*180); st.maxFlips=Math.max(st.maxFlips,ti.fl); st.maxComps=Math.max(st.maxComps,ti.comps+(r.uberDone?1:0));
    if(!r.uberDone) S.meter=Math.min(100,S.meter+pts/22*MOD.meter);
    if(pts>S.bestPts){S.bestPts=pts;S.bestName=name;}
    if(!S.tut&&ti.comps>0&&!SAVE.codex[ti.key]){
      SAVE.codex[ti.key]=1; st.newTricks++; S.xpBonus+=25;
      toast('NEW TRICK DISCOVERED',name);
    }
    popup((perfect?'PERFECT  ':'')+name+'  +'+pts.toLocaleString(),perfect?COL.cy:'#fff',perfect?26:22);
    if(ti.sig) popup('SIGNATURE TRICK',COL.gold,16,r.x*0.9,r.y+6);
    if(pts>=1500||perfect) cheer=Math.max(cheer,perfect?0.8:0.6);
    sfx(perfect?880:520,.2,'triangle',.08,perfect?400:200); buzz(perfect?[20,15,20]:15);
  } else sfx(200,.1,'sine',.05);
}

function startUber(){
  r.uber={t:0,dur:1.25,s0:r.spin,f0:r.flip,name:UBER_NAMES[(Math.random()*UBER_NAMES.length)|0]};
  popup('UBER!  '+r.uber.name.toUpperCase(),COL.mg,26,r.x*0.7,r.y+3);
  sfx(440,.5,'sawtooth',.07,800); slowT=0.9; flash=0.6; buzz([40,30,80]);
}

function groundStep(dt,inp){
  const th=Math.atan(groundSlope(r.x)), c=Math.cos(th), s=Math.sin(th);
  r.v+=-G*s*dt;
  if(inp.pump&&r.bail<=0){
    const dir=sgn(r.v)||(r.fx>=0?1:-1);
    const cap=V_CAP+E.vcap+1.1*S.mom;
    const eff=(Math.abs(r.x)>PIPE.flat?1:0.5)*Math.max(0,1-Math.abs(r.v)/cap);
    r.v+=dir*PUMP*E.pump*eff*dt;
  }
  const fr=(r.bail>0?7:0.5+0.0035*r.v*r.v)*dt;
  if(Math.abs(r.v)<=fr) r.v=0; else r.v-=sgn(r.v)*fr;
  r.x+=r.v*c*dt;
  if(Math.abs(r.x)>=PIPE.lipX){
    if(r.v*sgn(r.x)>0&&r.bail<=0){takeoff();return;}
    r.x=sgn(r.x)*(PIPE.lipX-0.001);
    if(r.v*sgn(r.x)>0) r.v=0;
  }
  r.y=groundY(r.x);
  const thD=Math.atan(groundSlope(r.x))/D2R;
  r.ang+=wrap180(thD-r.ang)*Math.min(1,dt*14);
  if(Math.abs(r.v)>1) r.fx+=(sgn(r.v)-r.fx)*Math.min(1,dt*12);
  r.crouch+=((inp.pump&&r.bail<=0?0.6:0.1)-r.crouch)*Math.min(1,dt*14);
  if(r.bail>0){r.tumble+=540*dt;}
  if(inp.pump&&r.bail<=0) r.charge=Math.min(1,r.charge+dt/0.7); else r.charge=0;
  if(r.pop){r.popT+=dt; if(r.popT>1.6){r.pop=0;r.popT=0;}}
  if(Math.abs(r.v)>8&&Math.random()<dt*70) spray(r.x,r.y+0.1,-r.v*0.12*c,1.5,1,'rgba(235,248,255,.8)',.14);
}

function airStep(dt,inp){
  const ga=GA_BASE*MOD.ga;
  r.vy-=ga*dt; r.vx+=r.dirIn*r.aIn*dt;
  r.x+=r.vx*dt; r.y+=r.vy*dt; r.airT+=dt;
  if(r.y>r.peak){r.peak=r.y; if(S.mode==='play') S.st.maxAlt=Math.max(S.st.maxAlt,r.peak-PIPE.lipY);}
  if(r.uber){
    const u=r.uber; u.t+=dt;
    const p=Math.min(1,u.t/u.dur), e=p*p*(3-2*p);
    r.spin=u.s0+720*e; r.flip=u.f0-360*e; r.grab=0;
    if(Math.random()<dt*90) spray(r.x,r.y+1,(Math.random()-.5)*8,(Math.random()-.5)*8,1,Math.random()<.5?COL.cy:COL.mg,.2);
    if(p>=1){r.uberDone=true;r.uberName=u.name;r.uber=null;S.meter=0;if(S.mode==='play'){S.st.ubers++;popup('UBER COMPLETE - LAND IT!',COL.cy,22);cheer=1;}}
  } else {
    const spinDir=Math.abs(inp.sx)>0.35?sgn(inp.sx):0, flipDir=Math.abs(inp.sy)>0.35?sgn(inp.sy):0;
    if(spinDir) r.spin+=spinDir*540*E.spin*dt;
    else{const tg=Math.round(r.spin/180)*180; r.spin+=clamp(tg-r.spin,-320*E.bal*dt,320*E.bal*dt);}
    const f=clamp(Math.abs(r.vy)/(0.8*r.vy0),0,1);
    const base=(GEO&&r.vy<0)?GEO.thLand*clamp(-r.vy/(0.8*r.vy0),0,1):r.thRef*f;
    if(flipDir){const d=flipDir*400*E.flip*dt; r.flipIn+=d; r.flip+=d*r.face;}
    else{const tg=base+360*Math.round((r.flip-base)/360); r.flip+=clamp(tg-r.flip,-260*E.bal*dt,260*E.bal*dt);}
    r.face=r.baseFace*(Math.abs(Math.round(r.spin/180))%2?-1:1);
    let g=-1; for(let i=0;i<4;i++) if(inp.g[i]){ if(g<0) g=i; r.grabT[i]+=dt; }
    r.grab=g;
  }
  r.crouch+=((r.grab>=0?0.75:0.3)-r.crouch)*Math.min(1,dt*12);
  r.fx=r.baseFace*Math.cos(r.spin*D2R);
  if(Math.random()<dt*30) spray(r.x,r.y,0,0,1,'rgba(200,240,255,.6)',.1);
  for(const gm of gems){ if(gm.got||gm.a<0.7) continue; const dx=gm.x-r.x, dy=gm.y-r.y; if(dx*dx+dy*dy<3.4) collectGem(gm); }
  if(r.vy<0){
    const gy=groundY(r.x);
    if(r.y<=gy){
      const ax=Math.abs(r.x);
      if(GEO){ GEO.touch(); }
      else if(ax>PIPE.lipX+1.8){
        r.x=sgn(r.x)*(PIPE.lipX-0.01); r.y=groundY(r.x); r.air=false; r.pop=0; recenter=true;
        r.ang=0; r.charge=0; respawnGems(); doBail('DECK LANDING',0);
      } else {
        if(ax>PIPE.lipX) r.x=sgn(r.x)*(PIPE.lipX-0.01);
        land();
      }
    }
  }
}

/* ---------- tutorial ---------- */
const TUT_STEPS=[
 'HOLD the left side of the screen to pump',
 'Ride up the wall, then RELEASE inside the glowing band',
 'In the air, DRAG your left thumb to spin',
 'HOLD a grab button while you are in the air',
 'Land it clean to score',
 'Fly through a gem for bonus points',
 'Hit a PERFECT pop to build MOMENTUM'
];
function tutTick(dt){
  const t=S.tut; if(!t) return;
  if(t.step>=TUT_STEPS.length){
    t.doneT+=dt;
    if(!SAVE.tutDone){SAVE.tutDone=true;SAVE.coins+=100;persist();toast('TRAINING COMPLETE','+100 coins. You are ready to drop in!');}
    return;
  }
  let ok=false;
  switch(t.step){
    case 0: if(input.pump&&!r.air) t.pumpT+=dt; ok=t.pumpT>1.2; break;
    case 1: ok=t.popped; break;
    case 2: ok=r.air&&Math.abs(r.spin)>=120; break;
    case 3: ok=r.air&&r.grab>=0&&r.grabT[r.grab]>0.3; break;
    case 4: ok=S.st.landed>=1; break;
    case 5: ok=S.st.gems>=1; break;
    case 6: ok=S.st.perfects>=1; break;
  }
  if(ok){t.step++; sfx(780,.15,'triangle',.07,300); if(t.step<TUT_STEPS.length) toast('NICE!',TUT_STEPS[t.step]);}
}

/* ---------- update ---------- */
function update(dt){
  if(S.kind==='air') return baUpdate(dt);
  if(S.kind==='dh') return dhUpdate(dt);
  if(S.mode==='menu') return;
  const play=S.mode==='play', demo=S.mode==='menu';
  if(!play&&!demo) return;
  let inp=input;
  if(demo){ demoInp.pump=!(popZone()&&distToLip(r.x)<=3.0); inp=demoInp; }

}

let AC=null, masterG=null, musicG=null, sfxG=null, noiseBuf=null, mStep=0, mNext=0, mTimer=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterG=AC.createGain(); masterG.connect(AC.destination);
    musicG=AC.createGain(); sfxG=AC.createGain(); musicG.connect(masterG); sfxG.connect(masterG);
    const n=Math.floor(AC.sampleRate*0.5); noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    applyVolumes();
    mNext=AC.currentTime+0.15; mTimer=setInterval(musicTick,30);
  }catch(e){AC=null;}
}
function applyVolumes(){ if(!AC) return; musicG.gain.value=SAVE.settings.music*0.55; sfxG.gain.value=SAVE.settings.sfx; }
function sfx(f,d,type,v,slide){
  if(!AC||!sfxG) return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v||0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(sfxG); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function buzz(p){ try{ if(SAVE.settings.haptics&&navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ---- music: Am - F - C - G synthwave loop, layers grow with momentum ---- */
const BPM=112, STEP_T=60/BPM/4;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mTone(f,t,dur,type,vol,lp){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let out=g;
  if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g);}
  else o.connect(g);
  g.connect(musicG); o.start(t); o.stop(t+dur+0.05);
}
function mNoise(t,dur,vol,type,freq){
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(musicG); s.start(t); s.stop(t+dur+0.02);
}
function kick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14);
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.connect(g); g.connect(musicG); o.start(t); o.stop(t+0.2);
}
function musicIntensity(){
  if(S.mode==='play') return Math.min(3,Math.floor(S.mom/1.5)+1);
  return 0;
}
function musicTick(){
  if(!AC||AC.state!=='running'||SAVE.settings.music<=0.01) { if(AC&&mNext<AC.currentTime) mNext=AC.currentTime+0.1; return; }
  if(S.mode==='paused'){ mNext=AC.currentTime+0.1; return; }
  while(mNext<AC.currentTime+0.15){ musicStep(mStep,mNext); mNext+=STEP_T; mStep++; }
}
function musicStep(st,t){
  const bar=Math.floor(st/16)%4, s=st%16, ch=CHORDS[bar], inten=musicIntensity();
  if(s===0) for(const n of ch) mTone(mtof(n),t,STEP_T*15,'sine',0.05,1200);
  const bassSteps=inten===0?[0,8]:[0,3,6,8,10,14];
  if(bassSteps.indexOf(s)>=0) mTone(mtof(ch[0]-24),t,STEP_T*(inten?1.6:6),'sawtooth',inten?0.16:0.1,420);
  if(inten>=1){
    if(s%4===0) kick(t);
    if(s===4||s===12) { mNoise(t,0.16,0.35,'bandpass',1800); }
    if(s%2===0) mNoise(t,0.04,0.12,'highpass',7000);
  }
  if(inten>=2){
    if(s%2===1) mNoise(t,0.03,0.07,'highpass',8000);
    const arp=[0,1,2,1][s%4]; mTone(mtof(ch[arp]+12),t,STEP_T*0.9,'square',0.045,2400);
  }
  if(inten>=3){
    if(s%8===0) mTone(mtof(ch[2]+24),t,STEP_T*6,'triangle',0.08,3000);
    if(s===14) mTone(mtof(ch[1]+24),t,STEP_T*2,'triangle',0.06,3000);
  }
}

  zoom+=(zT-zoom)*Math.min(1,dt*3); ppu=ppuBase*zoom;

  camB+=(clamp(r.y-visH*0.58,-3.2,40)-camB)*Math.min(1,dt*5);
  shake=Math.max(0,shake-dt*30);
  const skm=SAVE.settings.shake?1:0;
  shx=(Math.random()-.5)*shake*skm; shy=(Math.random()-.5)*shake*skm;
  cheer=Math.max(0,cheer-dt*0.6); flash=Math.max(0,flash-dt*2);

  const Vp=5.5, s0=0.13, farY=Vp+s0*(PIPE.lipY-Vp);
  const horizonSY=H+camB*ppu-farY*ppu;

  setScreen();
  drawSky(V,P,horizonSY,tt);
  for(let layer=0;layer<2;layer++){
    ctx.beginPath(); ctx.moveTo(0,horizonSY+4);
    const amp=(layer?0.34:0.5)*Math.min(H*0.5,260), off=layer?7:0;
    for(let i=0;i<=40;i++) ctx.lineTo(i/40*W,horizonSY-MT[(i+off)%41]*amp*(layer?0.8:1));
    ctx.lineTo(W,horizonSY+4); ctx.closePath();
    ctx.fillStyle=layer?P.mtB:P.mtA; ctx.fill();
    ctx.strokeStyle=layer?P.edgeB:P.edgeA; ctx.lineWidth=1.5; ctx.stroke();
  }

  setWorld();
  const deckG=ctx.createLinearGradient(0,PIPE.lipY,0,farY);
  deckG.addColorStop(0,P.deck[0]); deckG.addColorStop(1,P.deck[1]);
  ctx.fillStyle=deckG;
  for(const sd of [-1,1]){
    ctx.beginPath(); ctx.moveTo(sd*PIPE.lipX,PIPE.lipY); ctx.lineTo(sd*XM,PIPE.lipY); ctx.lineTo(sd*XM,farY); ctx.lineTo(sd*s0*PIPE.lipX,farY); ctx.closePath(); ctx.fill();
  }
  const mid=prof.slice(1,-1);
  const wg=ctx.createRadialGradient(0,Vp,0,0,Vp,26);
  wg.addColorStop(0,P.wall[0]); wg.addColorStop(.45,P.wall[1]); wg.addColorStop(1,P.wall[2]);
  ctx.fillStyle=wg;
  ctx.beginPath();
  mid.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  for(let i=mid.length-1;i>=0;i--){const p=mid[i]; ctx.lineTo(s0*p[0],Vp+s0*(p[1]-Vp));}
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=0.06;
  for(let k=-4;k<=4;k++){
    const x=k*PIPE.lipX/4.2, y=groundY(x);
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(s0*x,Vp+s0*(y-Vp)); ctx.stroke();
  }
  const spacing=30, base=S.prog%spacing, idx0=Math.floor(S.prog/spacing);
  for(let k=0;k<10;k++){
    const dist=(spacing-base)+k*spacing, s=1/(1+dist/45);
    if(s<s0*1.05) continue;
    ctx.strokeStyle=((idx0+k+1)%4)===0?P.ringB:P.ringA; ctx.globalAlpha=0.12+0.55*s; ctx.lineWidth=0.05+0.12*s;
    ctx.beginPath(); mid.forEach((p,i)=>{const px=s*p[0],py=Vp+s*(p[1]-Vp); i?ctx.lineTo(px,py):ctx.moveTo(px,py);}); ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(S.mode==='play'&&!S.tut){
    const df=S.len-S.prog;
    if(df<300&&df>0){
      const s=1/(1+df/45);
      ctx.strokeStyle='#fff'; ctx.lineWidth=0.35*s+0.08; ctx.globalAlpha=0.9;
      ctx.beginPath(); mid.forEach((p,i)=>{const px=s*p[0],py=Vp+s*(p[1]-Vp); i?ctx.lineTo(px,py):ctx.moveTo(px,py);}); ctx.stroke();
      ctx.strokeStyle=COL.mg; ctx.setLineDash([0.5*s+0.1,0.5*s+0.1]); ctx.beginPath(); mid.forEach((p,i)=>{const px=s*p[0],py=Vp+s*(p[1]-Vp); i?ctx.lineTo(px,py):ctx.moveTo(px,py);}); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha=1;
    }
  }
  const fg=ctx.createLinearGradient(0,PIPE.lipY,0,camB-4);
  fg.addColorStop(0,P.cut[0]); fg.addColorStop(1,P.cut[1]);
  ctx.fillStyle=fg;
  ctx.beginPath(); prof.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.lineTo(XM,camB-6); ctx.lineTo(-XM,camB-6); ctx.closePath(); ctx.fill();
  ctx.shadowColor=P.rim; ctx.shadowBlur=10; ctx.strokeStyle=P.rim; ctx.lineWidth=0.14;
  ctx.beginPath(); prof.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.shadowBlur=0;
  // crowd
  for(const c of crowd){
    const sc=c.row?0.75:1, by=PIPE.lipY+(c.row?0.5:0);
    const jump=cheer>0?Math.abs(Math.sin(tt*9+c.ph))*0.7*Math.min(1,cheer*2):0;
    ctx.fillStyle=c.c; ctx.fillRect(c.x-0.25*sc,by+jump,0.5*sc,c.h*0.6*sc);
    ctx.beginPath(); ctx.arc(c.x,by+jump+c.h*0.6*sc+0.2*sc,0.22*sc,0,Math.PI*2); ctx.fill();
  }
  // lamp towers
  for(const sd of [-1,1]){
    const lx2=sd*(PIPE.lipX+3.6), by=PIPE.lipY;
    ctx.strokeStyle='#1d2a55'; ctx.lineWidth=0.22; ctx.beginPath(); ctx.moveTo(lx2,by); ctx.lineTo(lx2,by+7); ctx.stroke();
    const gc='rgba('+(sd<0?P.lampL:P.lampR)+',';
    const lg=ctx.createRadialGradient(lx2,by+7.2,0,lx2,by+7.2,5);
    lg.addColorStop(0,gc+'.95)'); lg.addColorStop(1,gc+'0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(lx2,by+7.2,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(lx2,by+7.2,0.35,0,Math.PI*2); ctx.fill();
  }
  // pop timing band
  if(S.mode==='play'&&!r.air){
    const sd=sgn(r.v)||sgn(r.x)||1, pulse=0.55+0.35*Math.sin(tt*8);
    ctx.save(); ctx.lineCap='round';
    const segs=[[9.5,0.10,'rgba(255,255,255,.4)'],[6.5,0.17,'rgba(25,230,255,.7)'],[4.0,0.28,'rgba(255,47,185,'+pulse+')']];
    for(const sg of segs){
      ctx.strokeStyle=sg[2]; ctx.lineWidth=sg[1]; ctx.beginPath(); let st=false;
      for(const p of mid){ if(Math.sign(p[0])!==sd) continue; if(distToLip(p[0])<=sg[0]){ if(st) ctx.lineTo(p[0],p[1]+0.15); else {ctx.moveTo(p[0],p[1]+0.15); st=true;} } }
      ctx.stroke();
    }
    ctx.restore();
  }
  drawActors(dt,tt);

  drawOverlay(dt,V,P,tt);
}

/* ================= PAINT: portraits, boards, venue thumbs ================= */
function sizeCv(cv){
  const d=Math.min(window.devicePixelRatio||1,2), w=cv.clientWidth||300, h=cv.clientHeight||100;
  cv.width=Math.round(w*d); cv.height=Math.round(h*d);
}
function figure(c,R,B,cr,grab){
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle='#0a2a3a'; c.lineWidth=0.26; c.beginPath(); c.moveTo(-1.0,0.13); c.lineTo(1.0,0.13); c.stroke();
  c.strokeStyle=B.col; c.lineWidth=0.16; c.beginPath(); c.moveTo(-1.0,0.13); c.lineTo(1.0,0.13); c.stroke();
  c.strokeStyle=B.stripe; c.lineWidth=0.05; c.beginPath(); c.moveTo(-0.7,0.13); c.lineTo(0.7,0.13); c.stroke();
  const hipY=1.15-0.55*cr, kneeX=0.2+0.3*cr;
  c.strokeStyle=R.pants; c.lineWidth=0.3;
  for(const f of [[0.4,0.26],[-0.4,0.26]]){ c.beginPath(); c.moveTo(f[0],f[1]); c.lineTo(f[0]*0.5+kneeX*Math.sign(f[0])*0.5+0.1,(f[1]+hipY)*0.5); c.lineTo(0,hipY); c.stroke(); }
  const sx=0.08+0.12*cr, sy=hipY+0.72-0.22*cr;
  c.strokeStyle=R.jacket; c.lineWidth=0.55; c.beginPath(); c.moveTo(0,hipY); c.lineTo(sx,sy); c.stroke();
  c.globalAlpha=0.85; c.lineWidth=0.22;
  const h1=grab?[0.2,0.22]:[0.65,sy-0.1], h2=grab?[-0.5,sy-0.55]:[-0.55,sy-0.2];
  for(const h of [h1,h2]){ c.beginPath(); c.moveTo(sx,sy-0.08); c.lineTo((sx+h[0])*0.5,(sy+h[1])*0.5+0.1); c.lineTo(h[0],h[1]); c.stroke(); }
  c.globalAlpha=1;
  const hx=sx+0.08, hy=sy+0.36;
  c.fillStyle=R.helm; c.beginPath(); c.arc(hx,hy,0.27,0,Math.PI*2); c.fill();
  c.fillStyle=R.goggle; c.fillRect(hx+0.02,hy-0.06,0.3,0.14);
  c.fillStyle=R.jacket; c.fillRect(hx-0.28,hy+0.1,0.56,0.08);
}
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
// top-down board centred at 0,0, length L along x, width Wd
function boardTop(c,B,L,Wd){
  c.save();
  const hl=L/2, hw=Wd/2;
  rrect(c,-hl,-hw,L,Wd,hw); c.fillStyle=B.col;
  if(B.pat==='rainbow'){ const g=c.createLinearGradient(-hl,0,hl,0); g.addColorStop(0,B.col); g.addColorStop(.5,B.stripe); g.addColorStop(1,'#ffd23f'); c.fillStyle=g; }
  c.shadowColor=B.col; c.shadowBlur=Wd*0.5; c.fill(); c.shadowBlur=0;
  c.save(); rrect(c,-hl,-hw,L,Wd,hw); c.clip();
  c.fillStyle=B.stripe; c.strokeStyle=B.stripe; c.lineWidth=Wd*0.08; c.lineJoin='round';
  switch(B.pat){
    case 'dots': for(let i=-4;i<=4;i++){ c.beginPath(); c.arc(i*L*0.1,0,Wd*0.1,0,7); c.fill(); } break;
    case 'chevron': for(let i=-3;i<=3;i++){ c.beginPath(); c.moveTo(i*L*0.12-Wd*0.15,-hw*0.7); c.lineTo(i*L*0.12+Wd*0.15,0); c.lineTo(i*L*0.12-Wd*0.15,hw*0.7); c.stroke(); } break;
    case 'flame': for(let i=0;i<5;i++){ c.beginPath(); c.moveTo(-hl,(i-2)*Wd*0.2); c.quadraticCurveTo(-hl*0.4,(i-2)*Wd*0.28,-hl*(0.65-0.08*(2-Math.abs(i-2))),(i-2)*Wd*0.1); c.quadraticCurveTo(-hl*0.6,(i-2)*Wd*0.05,-hl,(i-2)*Wd*0.2+Wd*0.1); c.fill(); } break;
    case 'bolt': c.beginPath(); c.moveTo(-hl*0.6,-hw*0.6); c.lineTo(-hl*0.15,hw*0.3); c.lineTo(hl*0.05,-hw*0.3); c.lineTo(hl*0.4,hw*0.6); c.lineWidth=Wd*0.12; c.stroke(); break;
    case 'split': c.fillRect(-hl,-hw,L,hw); break;
    case 'checker': { const n=10,cw=L/n; for(let i=0;i<n;i++){ if(i%2===0) c.fillRect(-hl+i*cw,-hw,cw,hw); else c.fillRect(-hl+i*cw,0,cw,hw);} } break;
    case 'wave': c.beginPath(); for(let i=0;i<=40;i++){ const x=-hl+L*i/40, y=Math.sin(i*0.5)*hw*0.35; i?c.lineTo(x,y):c.moveTo(x,y);} c.lineWidth=Wd*0.1; c.stroke(); break;
    case 'star': { c.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?Wd*0.16:Wd*0.38; i?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);} c.closePath(); c.fill(); c.fillRect(-hl,-Wd*0.04,L*0.28,Wd*0.08); c.fillRect(hl-L*0.28,-Wd*0.04,L*0.28,Wd*0.08);} break;
    case 'rainbow': break;
    default: c.fillRect(-hl,-Wd*0.06,L,Wd*0.12); c.fillRect(-hl*0.5,-hw,Wd*0.1,Wd);
  }
  c.restore();
  c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=Wd*0.05; rrect(c,-hl,-hw,L,Wd,hw); c.stroke();
  // bindings
  c.fillStyle='#10162e'; for(const bx of [-L*0.2,L*0.2]){ rrect(c,bx-Wd*0.2,-hw*0.55,Wd*0.4,Wd*0.55,Wd*0.08); c.fill(); }
  c.restore();
}
function paintRiderThumb(cv,R,B){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height;
  c.clearRect(0,0,w,h);
  const g=c.createRadialGradient(w/2,h*0.55,0,w/2,h*0.55,h*0.8); g.addColorStop(0,R.jacket+'66'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,w,h);
  const k=Math.min(w/2.6,h/3.1); c.save(); c.translate(w/2,h*0.9); c.scale(k,-k); figure(c,R,B,0.15,false); c.restore();
}
function paintBoardThumb(cv,B){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height; c.clearRect(0,0,w,h);
  const L=Math.min(w*0.9,h*3.1); c.save(); c.translate(w/2,h/2); boardTop(c,B,L,L*0.27); c.restore();
}
function paintPreview(cv,R,B,t){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height; c.clearRect(0,0,w,h);
  const g=c.createRadialGradient(w*0.32,h*0.5,0,w*0.32,h*0.5,h*0.9); g.addColorStop(0,R.jacket+'55'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,w,h);
  const g2=c.createRadialGradient(w*0.78,h*0.5,0,w*0.78,h*0.5,h*0.7); g2.addColorStop(0,B.col+'44'); g2.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g2; c.fillRect(0,0,w,h);
  c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(w*0.32,h*0.9,w*0.17,h*0.03,0,0,7); c.fill();
  const k=h*0.3, bob=Math.sin(t*2)*0.04;
  c.save(); c.translate(w*0.32,h*0.9); c.scale(k,-k); c.translate(0,bob); c.rotate(Math.sin(t*1.3)*0.03); figure(c,R,B,0.15+0.05*Math.sin(t*2),true); c.restore();
  c.save(); c.translate(w*0.78,h*0.5+Math.sin(t*1.7)*h*0.012); c.rotate(-Math.PI/2+0.35+Math.sin(t*1.1)*0.04); boardTop(c,B,h*0.8,h*0.21); c.restore();
}
function paintVenue(cv,V,lock){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height,P=V.pal;
  const sg=c.createLinearGradient(0,0,0,h); sg.addColorStop(0,P.sky[0]); sg.addColorStop(.55,P.sky[1]); sg.addColorStop(1,P.sky[2]); c.fillStyle=sg; c.fillRect(0,0,w,h);
  if(P.stars){ c.fillStyle='#fff'; for(let i=0;i<30;i++){ c.globalAlpha=.4+.4*Math.sin(i*3.7); c.fillRect(((i*97)%100)/100*w,((i*53)%60)/100*h,1.5,1.5);} c.globalAlpha=1; }
  const hz=h*0.62, fx=P.fx;
  const orb=(x,y,r,col)=>{ const g=c.createRadialGradient(x,y,0,x,y,r*3); g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=g; c.fillRect(x-r*3,y-r*3,r*6,r*6); c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); };
  if(fx==='moon') orb(w*0.75,h*0.25,h*0.07,'rgba(200,230,255,.6)');
  else if(fx==='sun') orb(w*0.3,hz-h*0.06,h*0.1,'rgba(255,200,130,.8)');
  else if(fx==='sakura') orb(w*0.72,h*0.28,h*0.08,'rgba(255,190,215,.7)');
  else if(fx==='cosmos'){ c.fillStyle='#c4603a'; c.beginPath(); c.arc(w*0.25,h*0.3,h*0.12,0,7); c.fill(); c.strokeStyle='rgba(255,220,180,.6)'; c.lineWidth=2; c.beginPath(); c.ellipse(w*0.25,h*0.3,h*0.22,h*0.04,-0.35,0,7); c.stroke(); }
  else if(fx==='aurora'){ for(let b=0;b<3;b++){ c.strokeStyle=['rgba(80,255,190,.45)','rgba(120,160,255,.4)','rgba(200,120,255,.35)'][b]; c.lineWidth=h*0.06; c.beginPath(); for(let x=0;x<=w;x+=8){ const y=h*(0.2+0.1*b)+Math.sin(x*0.03+b)*h*0.05; x?c.lineTo(x,y):c.moveTo(x,y);} c.stroke(); } }
  else if(fx==='ember'){ const g=c.createLinearGradient(0,hz-h*0.35,0,hz); g.addColorStop(0,'rgba(255,90,30,0)'); g.addColorStop(1,'rgba(255,120,30,.6)'); c.fillStyle=g; c.fillRect(0,hz-h*0.35,w,h*0.35); }
  else if(fx==='city'){ for(let i=0;i<16;i++){ const bw=w/16, bh=(0.2+0.8*Math.abs(Math.sin(i*12.9)))*h*0.35; c.fillStyle=i%2?'#1a0a3a':'#240d4a'; c.fillRect(i*bw,hz-bh,bw-1,bh); c.fillStyle=i%3?'rgba(255,47,185,.8)':'rgba(25,230,255,.8)'; for(let y=hz-bh+3;y<hz-3;y+=6) if(Math.sin(i*5+y)>0) c.fillRect(i*bw+2,y,2,2); } }
  else if(fx==='storm'){ c.strokeStyle='#efe6ff'; c.lineWidth=1.5; c.beginPath(); let lx=w*0.65,ly=0; c.moveTo(lx,ly); while(ly<hz){ ly+=8; lx+=Math.sin(ly*3)*6; c.lineTo(lx,ly);} c.stroke(); }
  c.fillStyle=P.mtB; c.beginPath(); c.moveTo(0,hz); for(let i=0;i<=20;i++) c.lineTo(i/20*w,hz-(0.3+0.25*Math.sin(i*1.3)+0.15*Math.sin(i*2.9))*h*0.4); c.lineTo(w,hz); c.fill();
  // pipe cross-section
  const f=V.flat,R=V.R,al=80*Math.PI/180, lipX=f+R*Math.sin(al), lipY=R*(1-Math.cos(al));
  const sc=Math.min(w*0.8/(2*lipX),h*0.5/lipY), ox=w/2, oy=h*0.92;
  const yy=x=>{x=Math.abs(x); return x<=f?0:R-Math.sqrt(Math.max(0,R*R-(x-f)*(x-f)));};
  c.fillStyle=P.cut[0]; c.beginPath(); c.moveTo(0,hz+2); c.lineTo(0,oy-lipY*sc); c.lineTo(ox-lipX*sc,oy-lipY*sc);
  for(let x=-lipX;x<=lipX;x+=lipX/30) c.lineTo(ox+x*sc,oy-yy(x)*sc);
  c.lineTo(ox+lipX*sc,oy-lipY*sc); c.lineTo(w,oy-lipY*sc); c.lineTo(w,h); c.lineTo(0,h); c.closePath(); c.fill();
  c.strokeStyle=P.rim; c.lineWidth=2; c.shadowColor=P.rim; c.shadowBlur=6; c.beginPath(); for(let x=-lipX;x<=lipX;x+=lipX/30){ const X=ox+x*sc,Y=oy-yy(x)*sc; x<=-lipX?c.moveTo(X,Y):c.lineTo(X,Y);} c.stroke(); c.shadowBlur=0;
  if(lock){ c.fillStyle='rgba(5,8,24,.6)'; c.fillRect(0,0,w,h); }
}

function paintAir(cv,i,lock){
  const c=AIRS[i], P=VENUES[c.pv].pal, g=cv.getContext('2d'), w=cv.width, h=cv.height, geo=getCourse(i);
  const sg=g.createLinearGradient(0,0,0,h); sg.addColorStop(0,P.sky[0]); sg.addColorStop(.6,P.sky[1]); sg.addColorStop(1,P.sky[2]); g.fillStyle=sg; g.fillRect(0,0,w,h);
  if(P.stars){ g.fillStyle='#fff'; for(let k=0;k<26;k++){ g.globalAlpha=.4+.4*Math.sin(k*3.7); g.fillRect(((k*97)%100)/100*w,((k*53)%55)/100*h,1.5,1.5);} g.globalAlpha=1; }
  g.fillStyle=P.mtB; g.beginPath(); g.moveTo(0,h*0.7); for(let k=0;k<=20;k++) g.lineTo(k/20*w,h*0.7-(0.3+0.25*Math.sin(k*1.3)+0.15*Math.sin(k*2.9))*h*0.3); g.lineTo(w,h*0.7); g.fill();
  const x0=-8, x1=geo.x0+110, sc=Math.min(w/(x1-x0), h*0.75/(geo.ly+geo.startY+4)), ymax=Math.max(geo.startY,geo.ly)+2;
  const X=x=>(x-x0)*sc, Y=y=>h*0.9-(y+8)*sc*0.78;
  g.fillStyle=P.cut[0]; g.beginPath(); g.moveTo(X(x0),h);
  const pts=[]; for(let x=x0;x<=x1;x+=1.5) pts.push(x); pts.push(geo.lx,geo.lx+0.001,geo.x0-0.001,geo.x0); pts.sort((a,b)=>a-b);

const SCREENS={title:scrTitle,main:scrMain,venues:scrVenues,garage:scrGarage,codex:scrCodex,profile:scrProfile,settings:()=>scrSettings('main'),psettings:()=>scrSettings('pause'),pause:scrPause,over:scrOver};
function showScr(name){

function paintAll(){

/* ---- actions ---- */
function startPlay(opts,fresh){
  initAudio(); opts=opts||{};
  if(!opts.daily&&!opts.tut&&(fresh||!briefGoals.length)){ refreshGoals(); }
  else if(!opts.daily) setVenue(SAVE.sel.venue);
  hideScr(); startRun(opts); setUIPlay(true); $('#hint').innerHTML=PIPE_HINT; $('#hint').style.opacity=1; acc=0; slowT=0;
}
function togglePause(){
  if(S.mode==='play'){ S.mode='paused'; showScr('pause'); }
  else if(S.mode==='paused'){ S.mode='play'; hideScr(); acc=0; }
}
function quitToMenu(){ toMenuState(); setUIPlay(false); refreshGoals(); showScr('main'); }
function act(a){
  const [k,v,w]=a.split(':');
  initAudio();
  switch(k){
    case 'play': startPlay({},false); break;
    case 'daily': startPlay({daily:true}); break;
    case 'tut': startPlay({tut:true}); break;
    case 'again': if(RES&&RES.dh){ startDH(RES.vi); acc=0; } else if(RES&&RES.air){ startAir(RES.vi); acc=0; } else if(RES&&RES.daily) startPlay({daily:true}); else startPlay({},true); break;
    case 'scr': showScr(v); break;
    case 'resume': togglePause(); break;
    case 'restart': if(S.kind==='dh'){ const di=S.di; S.mode='over'; startDH(di); acc=0; break; } if(S.kind==='air'){ const ai=S.ai; S.mode='over'; startAir(ai); acc=0; break; } S.mode='over'; startPlay(S&&S.tut?{tut:true}:isDaily?{daily:true}:{},true); break;
    case 'quit': quitToMenu(); break;
    case 'venue': { const i=+v; if(venueUnlocked(i)){SAVE.sel.venue=i; persist(); toMenuState(); refreshGoals(); showScr('venues'); } else toast('LOCKED','Reach level '+VENUES[i].lvl+' to unlock'); break; }
    case 'air': startAir(SAVE.sel.air); acc=0; break;
    case 'dh': startDH(SAVE.sel.dh); acc=0; break;
    case 'dhsel': { const i=+v; if(dhUnlocked(i)){SAVE.sel.dh=i; persist(); showScr('venues');} else toast('LOCKED','Reach level '+DHS[i].lvl+' to unlock'); break; }
    case 'vtab': venTab=v; showScr('venues'); break;
    case 'airsel': { const i=+v; if(airUnlocked(i)){SAVE.sel.air=i; persist(); showScr('venues');} else toast('LOCKED','Reach level '+AIRS[i].lvl+' to unlock'); break; }
    case 'tab': garTab2=v; showScr('garage'); break;
    case 'pv': garTab2=v; if(v==='riders') garPv.rider=+w; else garPv.board=+w; showScr('garage'); break;
    case 'rider': { const i=+v; if(riderUnlocked(i)){SAVE.sel.rider=i; garPv.rider=i; persist(); recalcE(); showScr('garage');} else toast('LOCKED','Reach level '+RIDERS[i].lvl+' to unlock '+RIDERS[i].name); break; }
    case 'board': { const i=+v, B=BOARDS[i];
      if(SAVE.boardsU[i]){SAVE.sel.board=i;garPv.board=i;persist();recalcE();showScr('garage');}
      else if(SAVE.coins>=B.cost){SAVE.coins-=B.cost;SAVE.boardsU[i]=1;SAVE.sel.board=i;garPv.board=i;persist();recalcE();sfx(880,.3,'triangle',.08,500);toast('PURCHASED',B.name);showScr('garage');}
      else toast('NOT ENOUGH COINS','Need '+fmt(B.cost-SAVE.coins)+' more');
      break; }
    case 'tog': SAVE.settings[v]=!SAVE.settings[v]; persist(); applySettings(); showScr(curScr); break;
    case 'reset': if(!confirmReset){confirmReset=true; showScr(curScr);} else { SAVE=defaultSave(); persist(); applySettings(); confirmReset=false; toMenuState(); refreshGoals(); showScr('main'); } break;
    case 'share': shareScore(); break;
  }
}

/* ---- input ---- */
const keys={};
const pad=$('#padL'), sb=$('#stickBase'), sk=$('#stickKnob');
let padId=null,ox=0,oy=0,lx=0,ly=0;
function showStick(x,y){sb.style.display='block';sb.style.left=x+'px';sb.style.top=y+'px';sk.style.transform='translate(0,0)';}
pad.addEventListener('pointerdown',e=>{
  if(padId!==null) return;
  padId=e.pointerId; try{pad.setPointerCapture(e.pointerId);}catch(_){}
  ox=lx=e.clientX; oy=ly=e.clientY; T.pump=true; T.sx=T.sy=0; showStick(ox,oy); e.preventDefault();
});
pad.addEventListener('pointermove',e=>{
  if(e.pointerId!==padId) return;
  lx=e.clientX; ly=e.clientY;
  const R=44, sens=SAVE.settings.sens||1, dx=lx-ox, dy=ly-oy;
  T.sx=clamp(dx*sens/R,-1,1); T.sy=clamp(-dy*sens/R,-1,1);
  const m=Math.hypot(dx,dy), k=m>R?R/m:1;
  sk.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)'; e.preventDefault();
});
function padEnd(e){ if(e.pointerId!==padId) return; padId=null; T.pump=false; T.sx=T.sy=0; sb.style.display='none'; }
pad.addEventListener('pointerup',padEnd); pad.addEventListener('pointercancel',padEnd); pad.addEventListener('lostpointercapture',padEnd);
document.querySelectorAll('.gb').forEach(b=>{
  const i=+b.dataset.g;
  const down=e=>{T.g[i]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault();};
  const up=()=>{T.g[i]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
});
$('#uber').addEventListener('pointerdown',e=>{uberReq=true;initAudio();e.preventDefault();});
$('#pauseBtn').addEventListener('click',togglePause);
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&S&&S.mode==='play') e.preventDefault();
  if(e.repeat) return;
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Enter'){
    if(curScr==='title') showScr('main'); else if(curScr==='main') act('play'); else if(curScr==='over') act('again'); else if(S.mode==='play') uberReq=true;
  }
  if(e.code==='KeyP'||e.code==='Escape') togglePause();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in keys) keys[k]=false; if(S&&S.mode==='play') togglePause();});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S&&S.mode==='play') togglePause(); });
const GKEYS=['KeyZ','KeyX','KeyC','KeyV'];
function readInput(){
  const kp=!!(keys.Space||keys.ShiftLeft||keys.ShiftRight);
  const ksx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
  const ksy=((keys.ArrowUp||keys.KeyW)?1:0)-((keys.ArrowDown||keys.KeyS)?1:0);
  input.pump=T.pump||kp;
  input.sx=Math.abs(T.sx)>Math.abs(ksx)?T.sx:ksx;
  input.sy=Math.abs(T.sy)>Math.abs(ksy)?T.sy:ksy;
  for(let i=0;i<4;i++) input.g[i]=T.g[i]||!!keys[GKEYS[i]];
  if(recenter){recenter=false; if(padId!==null){ox=lx;oy=ly;T.sx=T.sy=0;showStick(ox,oy);}}
}

/* ---- main loop ---- */
const STEP=1/120; let acc=0,last=0;
function loop(ts){
  const now=ts/1000; const dt=Math.min(0.05,now-last||0.016); last=now;
  readInput();
  if(slowT>0) slowT=Math.max(0,slowT-dt);
  acc+=dt*(slowT>0?0.5:1); let n=0;
  while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++;}
  if(n>=12) acc=0;
  render(dt);
  if(curScr==='garage'){ const pv=cardEl.querySelector('#pv'); if(pv&&pv.width) paintPreview(pv,RIDERS[garPv.rider],BOARDS[garPv.board],now); }
  requestAnimationFrame(loop);
}

  window.__frost={get S(){return S;},get r(){return r;},get SAVE(){return SAVE;},get gems(){return gems;},get combo(){return combo;},get RES(){return RES;},
    input,T,update,PIPE,groundY,distToLip,popGrade,trickInfo,readInput,act,showScr,startPlay,endRun,setVenue,VENUES,RIDERS,BOARDS,SCREENS,startAir,AIRS,getCourse,startDH,DHS,getDH,dhSimRivalOnly,get D(){return D;},DH_MEDALS,get A(){return A;},setUber(){uberReq=true;},
    setSel(rd,bd){SAVE.sel.rider=rd;SAVE.sel.board=bd;recalcE();},get E(){return E;}};
}
boot();
